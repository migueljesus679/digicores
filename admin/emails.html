<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emails Recebidos - DigiCores Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    h1,h2,h3,h4,h5,h6 { font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; }

    .email-status-sent    { color: #16a34a; font-weight: 600; }
    .email-status-failed  { color: #dc2626; font-weight: 600; }
    .email-status-no_config { color: #d97706; font-weight: 600; }
    .email-message-preview {
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── Modal Overlay ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    /* ── Modal Box ── */
    .modal-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 0;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
      animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── Modal Header ── */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 28px 32px 20px;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      z-index: 1;
    }
    .modal-header-left { display: flex; flex-direction: column; gap: 6px; }
    .modal-header h3 {
      font-size: 20px; font-weight: 700; margin: 0;
      font-family: 'Poppins', sans-serif; color: #111;
    }
    .modal-header-meta {
      font-size: 13px; color: #6c757d;
      display: flex; align-items: center; gap: 10px;
    }
    .modal-close {
      background: #f5f5f5;
      border: none;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      color: #555;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .modal-close:hover { background: #ffe8e0; color: #FF4500; }

    /* ── Modal Body ── */
    .modal-body { padding: 24px 32px 32px; }

    /* ── Status Banner ── */
    .modal-status-banner {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: 12px;
      margin-bottom: 24px; font-weight: 600; font-size: 14px;
    }
    .modal-status-banner.sent    { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .modal-status-banner.failed  { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .modal-status-banner.no_config { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    .modal-status-icon { font-size: 20px; }

    /* ── Detail Fields ── */
    .detail-section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: #aaa;
      margin: 0 0 12px; font-family: 'Poppins', sans-serif;
    }
    .detail-fields {
      background: #f8f9fa;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #f0f0f0;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #efefef;
      font-size: 14px;
      align-items: center;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      font-weight: 600; color: #888;
      font-size: 13px; font-family: 'Poppins', sans-serif;
    }
    .detail-value { color: #1a1a1a; word-break: break-word; }

    /* ── Error Box ── */
    .detail-error-box {
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 10px; padding: 12px 16px;
      font-size: 13px; color: #b91c1c; line-height: 1.6;
      margin-bottom: 20px;
    }
    .detail-error-box strong { display: block; margin-bottom: 4px; }

    /* ── Message Box ── */
    .detail-message-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: #aaa; margin-bottom: 10px;
      font-family: 'Poppins', sans-serif;
    }
    .detail-message {
      background: #f8f9fa;
      border-left: 3px solid #FF4500;
      border-radius: 0 10px 10px 0;
      padding: 18px 20px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.75;
      color: #333;
      margin-bottom: 24px;
    }

    /* ── Modal Footer ── */
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 10px;
      padding-top: 8px; border-top: 1px solid #f0f0f0;
      margin-top: 8px;
    }

    /* ── Misc ── */
    .msg-id {
      font-size: 11px; color: #aaa;
      font-family: monospace; word-break: break-all;
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px;
    }
    .dot-sent    { background: #16a34a; }
    .dot-failed  { background: #dc2626; }
    .dot-no_config { background: #d97706; }
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body class="admin-body">
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <div class="logo">Digi<span>Cores</span></div>
      <small>Back Office</small>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Menu</div>
      <a href="dashboard.html"><span class="nav-icon">📊</span><span>Dashboard</span></a>
      <a href="produtos.html"><span class="nav-icon">📦</span><span>Produtos</span></a>
      <a href="produto-form.html"><span class="nav-icon">➕</span><span>Novo Produto</span></a>
      <a href="emails.html" class="active"><span class="nav-icon">📧</span><span>Emails</span></a>
      <a href="configuracoes.html"><span class="nav-icon">⚙️</span><span>Configurações</span></a>
      <div class="sidebar-section">Loja</div>
      <a href="../index.html" target="_blank"><span class="nav-icon">🌐</span><span>Ver Loja</span></a>
      <a href="../produtos.html" target="_blank"><span class="nav-icon">🛍️</span><span>Ver Produtos</span></a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-user-info" id="userName">Administrador</div>
      <div class="sidebar-user-role">Admin</div>
      <button class="sidebar-logout" onclick="DigiAuth.logout()">Terminar Sessão</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-page-title">Emails Recebidos</div>
      <div class="admin-topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="loadEmails()">↻ Atualizar</button>
      </div>
    </div>

    <div class="admin-content">

      <!-- Stats bar -->
      <div class="stats-grid" id="statsBar" style="margin-bottom:24px;"></div>

      <!-- Filters -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;">
        <input type="search" id="searchInput" placeholder="Pesquisar por nome, email ou assunto..."
          style="flex:1;min-width:200px;padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;" />
        <select id="statusFilter"
          style="padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;">
          <option value="">Todos os estados</option>
          <option value="sent">Enviados</option>
          <option value="failed">Falhados</option>
          <option value="no_config">Sem configuração</option>
        </select>
        <span id="countLabel" style="font-size:14px;color:var(--text-muted);white-space:nowrap;"></span>
      </div>

      <!-- Table -->
      <div class="admin-card">
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Data / Hora</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Assunto</th>
                <th>Mensagem</th>
                <th>Estado</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="emailsBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="empty-icon">📭</div>
          <p>Nenhum email encontrado.</p>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal de detalhe -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <div class="modal-header-left">
        <h3 id="modalTitle">Detalhe do Email</h3>
        <div class="modal-header-meta" id="modalMeta"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()" title="Fechar (Esc)">✕</button>
    </div>
    <div class="modal-body" id="modalContent"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/auth.js"></script>
<script>
  if (!DigiAuth.requireAdminFromAdmin()) { /* redirected */ }
  const session = DigiAuth.getSession();
  if (session) document.getElementById('userName').textContent = session.name;

  let allEmails = [];

  function showToast(msg, type = '') {
    const tc = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    tc.appendChild(t);
    setTimeout(() => { t.classList.add('hiding'); setTimeout(() => t.remove(), 300); }, 3000);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric' })
      + ' ' + d.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
  }

  function statusLabel(status) {
    const map = { sent: 'Enviado', failed: 'Falhado', no_config: 'Sem config.' };
    return map[status] || status;
  }

  function statusClass(status) {
    return `email-status-${status}`;
  }

  function renderStats() {
    const total  = allEmails.length;
    const sent   = allEmails.filter(e => e.status === 'sent').length;
    const failed = allEmails.filter(e => e.status === 'failed').length;
    const noConf = allEmails.filter(e => e.status === 'no_config').length;

    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card">
        <div class="stat-card-top">
          <div><div class="stat-card-value">${total}</div><div class="stat-card-label">Total</div></div>
          <div class="stat-card-icon orange">📧</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-top">
          <div><div class="stat-card-value">${sent}</div><div class="stat-card-label">Enviados</div></div>
          <div class="stat-card-icon green">✅</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-top">
          <div><div class="stat-card-value">${failed}</div><div class="stat-card-label">Falhados</div></div>
          <div class="stat-card-icon" style="background:#fee2e2;color:#dc2626;">❌</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-top">
          <div><div class="stat-card-value">${noConf}</div><div class="stat-card-label">Sem Config.</div></div>
          <div class="stat-card-icon" style="background:#fef3c7;color:#d97706;">⚠️</div>
        </div>
      </div>`;
  }

  function renderTable(emails) {
    const tbody = document.getElementById('emailsBody');
    const empty = document.getElementById('emptyState');
    document.getElementById('countLabel').textContent = `${emails.length} resultado(s)`;

    if (!emails.length) {
      tbody.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = emails.map(e => `
      <tr>
        <td style="white-space:nowrap;font-size:13px;">${formatDate(e.timestamp)}</td>
        <td style="font-weight:600;">${escHtml(e.name)}</td>
        <td><a href="mailto:${escHtml(e.email)}" style="color:var(--primary);">${escHtml(e.email)}</a></td>
        <td>${escHtml(e.subject || '—')}</td>
        <td><div class="email-message-preview">${escHtml(e.message)}</div></td>
        <td>
          <span class="${statusClass(e.status)}">
            <span class="status-dot dot-${e.status}"></span>${statusLabel(e.status)}
          </span>
        </td>
        <td>
          <div class="table-actions">
            <button class="action-btn action-btn-edit" onclick="openDetail('${e.id}')">Ver</button>
            <button class="action-btn action-btn-delete" onclick="deleteEmail('${e.id}')">Apagar</button>
          </div>
        </td>
      </tr>`).join('');
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const filtered = allEmails.filter(e => {
      const matchSearch = !search ||
        e.name.toLowerCase().includes(search) ||
        e.email.toLowerCase().includes(search) ||
        (e.subject || '').toLowerCase().includes(search) ||
        e.message.toLowerCase().includes(search);
      const matchStatus = !status || e.status === status;
      return matchSearch && matchStatus;
    });
    renderTable(filtered);
  }

  async function loadEmails() {
    try {
      const res = await fetch('/api/emails');
      if (!res.ok) throw new Error('Erro ao carregar emails');
      allEmails = await res.json();
      renderStats();
      applyFilters();
    } catch (err) {
      showToast('Erro ao carregar emails: ' + err.message, 'error');
    }
  }

  async function deleteEmail(id) {
    if (!confirm('Apagar este registo de email?')) return;
    try {
      const res = await fetch(`/api/emails/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Erro ao apagar');
      allEmails = allEmails.filter(e => e.id !== id);
      renderStats();
      applyFilters();
      showToast('Registo apagado.', 'success');
    } catch (err) {
      showToast('Erro: ' + err.message, 'error');
    }
  }

  function openDetail(id) {
    const e = allEmails.find(x => x.id === id);
    if (!e) return;

    const statusConfig = {
      sent:      { label: 'Enviado com sucesso',              icon: '✅', cls: 'sent'      },
      failed:    { label: 'Falhou ao enviar',                 icon: '❌', cls: 'failed'    },
      no_config: { label: 'Email não enviado (sem config.)',  icon: '⚠️', cls: 'no_config' }
    };
    const sc = statusConfig[e.status] || { label: e.status, icon: '📧', cls: 'no_config' };

    document.getElementById('modalTitle').textContent = `Mensagem de ${escHtml(e.name)}`;
    document.getElementById('modalMeta').innerHTML =
      `<span>📅 ${formatDate(e.timestamp)}</span>
       <span style="color:#ddd;">|</span>
       <span>${escHtml(e.subject || 'Sem assunto')}</span>`;

    document.getElementById('modalContent').innerHTML = `
      <!-- Status banner -->
      <div class="modal-status-banner ${sc.cls}">
        <span class="modal-status-icon">${sc.icon}</span>
        <span>${sc.label}</span>
      </div>

      <!-- Contact details -->
      <div class="detail-section-title">Dados do Remetente</div>
      <div class="detail-fields">
        <div class="detail-row">
          <span class="detail-label">Nome</span>
          <span class="detail-value">${escHtml(e.name)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value">
            <a href="mailto:${escHtml(e.email)}" style="color:var(--primary);font-weight:600;">${escHtml(e.email)}</a>
          </span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Telefone</span>
          <span class="detail-value">${e.phone ? `<a href="tel:${escHtml(e.phone)}" style="color:var(--primary);">${escHtml(e.phone)}</a>` : '<span style="color:#bbb;">—</span>'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Assunto</span>
          <span class="detail-value">${escHtml(e.subject || '—')}</span>
        </div>
      </div>

      ${e.error ? `
      <!-- Error box -->
      <div class="detail-error-box">
        <strong>⚠️ Erro ao enviar email:</strong>
        ${escHtml(e.error)}
      </div>` : ''}

      ${e.messageId ? `
      <div class="detail-fields" style="margin-bottom:20px;">
        <div class="detail-row">
          <span class="detail-label">Message-ID</span>
          <span class="detail-value msg-id">${escHtml(e.messageId)}</span>
        </div>
      </div>` : ''}

      <!-- Message -->
      <div class="detail-message-label">Mensagem</div>
      <div class="detail-message">${escHtml(e.message)}</div>

      <!-- Footer actions -->
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" onclick="closeModalDirect()">Fechar</button>
        <a href="mailto:${escHtml(e.email)}?subject=Re: ${encodeURIComponent(e.subject || 'Contacto DigiCores')}"
           class="btn btn-primary btn-sm">↩ Responder por Email</a>
      </div>`;

    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal(event) {
    if (event.target === document.getElementById('modalOverlay')) closeModalDirect();
  }
  function closeModalDirect() {
    document.getElementById('modalOverlay').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

  function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('statusFilter').addEventListener('change', applyFilters);

  loadEmails();
</script>
</body>
</html>
