<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerir Produtos - DigiCores Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body">
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <div class="logo">Digi<span>Cores</span></div>
      <small>Back Office</small>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Menu</div>
      <a href="dashboard.html"><span class="nav-icon">📊</span><span>Dashboard</span></a>
      <a href="produtos.html" class="active"><span class="nav-icon">📦</span><span>Produtos</span></a>
      <a href="produto-form.html"><span class="nav-icon">➕</span><span>Novo Produto</span></a>
      <a href="emails.html"><span class="nav-icon">📧</span><span>Emails</span></a>
      <div class="sidebar-section">Loja</div>
      <a href="../index.html" target="_blank"><span class="nav-icon">🌐</span><span>Ver Loja</span></a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-user-info" id="userName">Administrador</div>
      <div class="sidebar-user-role">Admin</div>
      <button class="sidebar-logout" onclick="DigiAuth.logout()">Terminar Sessão</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-page-title">Gerir Produtos</div>
      <div class="admin-topbar-actions">
        <a href="produto-form.html" class="btn btn-primary btn-sm">+ Novo Produto</a>
      </div>
    </div>

    <div class="admin-content">

      <!-- Filters -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;">
        <input type="search" id="searchInput" placeholder="Pesquisar produtos..." style="flex:1;min-width:200px;padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;" />
        <select id="categoryFilter" style="padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;min-width:180px;">
          <option value="">Todas as Categorias</option>
        </select>
        <select id="statusFilter" style="padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;">
          <option value="">Todos os Estados</option>
          <option value="active">Ativos</option>
          <option value="inactive">Inativos</option>
          <option value="featured">Em Destaque</option>
        </select>
        <span id="countLabel" style="font-size:13px;color:var(--text-muted);white-space:nowrap;"></span>
      </div>

      <!-- Table -->
      <div class="admin-card">
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th style="width:40px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()" /></th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Preço Base</th>
                <th>Destaque</th>
                <th>Estado</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
          </table>
        </div>
        <div id="bulkBar" style="display:none;padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);display:none;align-items:center;gap:12px;">
          <span id="selectedCount" style="font-size:13px;font-weight:600;"></span>
          <button class="btn btn-danger btn-sm" onclick="bulkDelete()">🗑️ Eliminar Selecionados</button>
          <button class="btn btn-ghost btn-sm" onclick="clearSelection()">Cancelar</button>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Confirm Delete Dialog -->
<div class="overlay" id="deleteOverlay">
  <div class="dialog">
    <h3>🗑️ Eliminar Produto</h3>
    <p>Tem a certeza que quer eliminar <strong id="deleteProductName"></strong>? Esta ação não pode ser desfeita.</p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" onclick="closeDeleteDialog()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script>
  if (!DigiAuth.requireAdminFromAdmin()) { /* redirected */ }

  const session = DigiAuth.getSession();
  if (session) document.getElementById('userName').textContent = session.name;

  let allProducts = [];
  let filteredProducts = [];
  let deleteId = null;
  let selectedIds = new Set();

  function showToast(msg, type = '') {
    const tc = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span> ${msg}`;
    tc.appendChild(t);
    setTimeout(() => { t.classList.add('hiding'); setTimeout(() => t.remove(), 300); }, 3000);
  }

  function initFilters() {
    const cats = DigiDB.getCategories();
    const sel = document.getElementById('categoryFilter');
    sel.innerHTML = '<option value="">Todas as Categorias</option>' +
      cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  function getCategoryName(id) {
    const c = DigiDB.getCategories().find(c => c.id === id);
    return c ? `${c.icon} ${c.name}` : id;
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('categoryFilter').value;
    const status = document.getElementById('statusFilter').value;

    filteredProducts = allProducts.filter(p => {
      if (search && !p.name.toLowerCase().includes(search) && !p.description.toLowerCase().includes(search)) return false;
      if (cat && p.category !== cat) return false;
      if (status === 'active' && !p.active) return false;
      if (status === 'inactive' && p.active) return false;
      if (status === 'featured' && !p.featured) return false;
      return true;
    });

    document.getElementById('countLabel').textContent = `${filteredProducts.length} produto${filteredProducts.length !== 1 ? 's' : ''}`;

    const tbody = document.getElementById('productsTableBody');
    if (filteredProducts.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted);">Nenhum produto encontrado.</td></tr>`;
      return;
    }

    tbody.innerHTML = filteredProducts.map(p => `
      <tr class="${selectedIds.has(p.id) ? 'selected' : ''}" style="${selectedIds.has(p.id) ? 'background:rgba(255,69,0,0.04);' : ''}">
        <td><input type="checkbox" ${selectedIds.has(p.id) ? 'checked' : ''} onchange="toggleSelect('${p.id}', this)" /></td>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${p.image}" alt="${p.name}" class="product-thumb" onerror="this.src='https://placehold.co/48x36/f0f2f5/999?text=?'">
            <div>
              <div style="font-weight:600;font-size:14px;">${p.name}</div>
              <div style="font-size:11px;color:var(--text-muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.description}</div>
            </div>
          </div>
        </td>
        <td><span class="badge badge-info" style="font-size:11px;">${getCategoryName(p.category)}</span></td>
        <td><span class="badge badge-primary" style="font-size:11px;">${p.pricingType}</span></td>
        <td>
          <strong>€${p.startingPrice.toFixed(2)}</strong>
          ${p.priceUnit ? `<span style="font-size:11px;color:var(--text-muted);"> ${p.priceUnit}</span>` : ''}
        </td>
        <td>
          <button onclick="toggleFeatured('${p.id}')" style="background:none;border:none;cursor:pointer;font-size:18px;" title="${p.featured ? 'Remover destaque' : 'Adicionar destaque'}">
            ${p.featured ? '⭐' : '☆'}
          </button>
        </td>
        <td>
          <button onclick="toggleActive('${p.id}')" class="badge ${p.active ? 'badge-success' : 'badge-danger'}" style="cursor:pointer;border:none;" title="Clique para ${p.active ? 'desativar' : 'ativar'}">
            ${p.active ? 'Ativo' : 'Inativo'}
          </button>
        </td>
        <td>
          <div class="table-actions">
            <a href="produto-form.html?id=${p.id}" class="action-btn action-btn-edit">✏️ Editar</a>
            <a href="../produto.html?id=${p.id}" target="_blank" class="action-btn action-btn-view">👁 Ver</a>
            <button class="action-btn action-btn-delete" onclick="openDeleteDialog('${p.id}', '${p.name.replace(/'/g, "\\'")}')">🗑️ Eliminar</button>
          </div>
        </td>
      </tr>`).join('');
  }

  function toggleActive(id) {
    const p = DigiDB.getProduct(id);
    if (!p) return;
    DigiDB.updateProduct(id, { active: !p.active });
    allProducts = DigiDB.getProducts();
    renderTable();
    showToast(`Produto ${p.active ? 'desativado' : 'ativado'}!`, 'success');
  }

  function toggleFeatured(id) {
    const p = DigiDB.getProduct(id);
    if (!p) return;
    DigiDB.updateProduct(id, { featured: !p.featured });
    allProducts = DigiDB.getProducts();
    renderTable();
  }

  function openDeleteDialog(id, name) {
    deleteId = id;
    document.getElementById('deleteProductName').textContent = name;
    document.getElementById('deleteOverlay').classList.add('open');
  }

  function closeDeleteDialog() {
    deleteId = null;
    document.getElementById('deleteOverlay').classList.remove('open');
  }

  function confirmDelete() {
    if (!deleteId) return;
    const p = DigiDB.getProduct(deleteId);
    DigiDB.deleteProduct(deleteId);
    allProducts = DigiDB.getProducts();
    closeDeleteDialog();
    renderTable();
    showToast(`"${p?.name}" eliminado.`, 'success');
  }

  function toggleSelect(id, cb) {
    if (cb.checked) selectedIds.add(id);
    else selectedIds.delete(id);
    updateBulkBar();
  }

  function toggleSelectAll() {
    const allChecked = document.getElementById('selectAll').checked;
    if (allChecked) filteredProducts.forEach(p => selectedIds.add(p.id));
    else selectedIds.clear();
    updateBulkBar();
    renderTable();
  }

  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    const countEl = document.getElementById('selectedCount');
    if (selectedIds.size > 0) {
      bar.style.display = 'flex';
      countEl.textContent = `${selectedIds.size} selecionado${selectedIds.size !== 1 ? 's' : ''}`;
    } else {
      bar.style.display = 'none';
    }
  }

  function clearSelection() {
    selectedIds.clear();
    updateBulkBar();
    renderTable();
  }

  function bulkDelete() {
    if (selectedIds.size === 0) return;
    const count = selectedIds.size;
    if (!confirm(`Eliminar ${count} produto${count !== 1 ? 's' : ''}? Esta ação não pode ser desfeita.`)) return;
    selectedIds.forEach(id => DigiDB.deleteProduct(id));
    selectedIds.clear();
    allProducts = DigiDB.getProducts();
    updateBulkBar();
    renderTable();
    showToast(`${count} produto${count !== 1 ? 's eliminados' : ' eliminado'}.`, 'success');
  }

  // Init
  allProducts = DigiDB.getProducts();
  initFilters();
  renderTable();

  document.getElementById('searchInput').addEventListener('input', renderTable);
  document.getElementById('categoryFilter').addEventListener('change', renderTable);
  document.getElementById('statusFilter').addEventListener('change', renderTable);

  // Close dialog on overlay click
  document.getElementById('deleteOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeDeleteDialog();
  });
</script>
</body>
</html>
